; Bring-up and tests for components/mag_can (main board side of the mag board CAN link).
;
;   pio run -e teensy41 -t upload && pio device monitor   bring-up sketch, prints each node once a second
;   pio test -e native                                    decoder tests on this computer
;   pio test -e teensy41                                  same tests on the Teensy

[env]
lib_deps =
    mag_can=symlink://../../components/mag_can @ 1.0.0
; extra warnings for this project and the mag_can library only (see its library.json),
; not for the framework
build_src_flags =
    -Wall
    -Wextra

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; same flags as prod/main_board, where mag_can will be integrated
build_flags =
    -std=c++20
    -D TEENSY_OPT_FASTER
    -D LFS_NO_CACHE=1
    -D STACK_MARGIN=32
    -D MAG_CAN_DEBUG

[env:native]
platform = native
build_flags =
    -std=c++20
