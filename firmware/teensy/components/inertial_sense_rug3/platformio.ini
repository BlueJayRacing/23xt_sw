; Teensy 4.1 IMU logger for an Inertial Sense IMX
; Build: PlatformIO "Build" (checkmark)   Upload: PlatformIO "Upload" (arrow)

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; teensy-cli waits for the board and only reports SUCCESS after it actually
; flashes. (teensy-gui just hands the .hex to the Teensy Loader window and
; reports SUCCESS right away, even with no board plugged in.)
upload_protocol = teensy-cli
monitor_speed = 115200

build_flags =
    ; The SDK's ISConstants.h doesn't list the Teensy 4.1 chip (IMXRT1062).
    ; Defining ARM selects its generic little-endian embedded ARM settings.
    -DARM
