syntax = "proto3";

import "nanopb.proto";

message WSG_Data {
    uint32 id               = 1 [(nanopb).int_size = IS_8];
    fixed32 bias            = 2;
    repeated uint32 sg_data = 3 [(nanopb).max_count = 3, (nanopb).fixed_count = true, (nanopb).int_size = IS_16];
    fixed64 timestamp       = 4;
}

message WSG_Batch {
    repeated WSG_Data samples = 1 [(nanopb).max_count = 6];
}
